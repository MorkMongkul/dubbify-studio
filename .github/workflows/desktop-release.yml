name: Desktop release

# Builds the macOS app for Apple Silicon and Intel on GitHub's Mac machines.
#
# Run it by pushing a version tag (it also creates a draft GitHub Release with
# both DMGs and the FFmpeg source):
#   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which only uploads the DMGs as
# build artifacts.
#
# The website's download buttons point at
#   releases/latest/download/Dubify-Studio-Apple-Silicon.dmg (and -Intel.dmg),
# so the DMGs are published under those fixed names. "latest" only counts
# published releases: the website offers a version once its draft is published.
#
# Installed copies update themselves: they read latest.json from the latest
# release and install the update package for their chip, signed with the
# TAURI_SIGNING_PRIVATE_KEY secret (the app has the matching public key).
#
# Builds are ad-hoc signed (on other Macs people confirm the app once, under
# System Settings → Privacy & Security → Open Anyway) until these repository
# secrets exist: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_PASSWORD
# (app-specific password), APPLE_TEAM_ID.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: building only reads the repo; the release job alone may
# create a release. Third-party actions are pinned to exact commits.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15          # Apple Silicon
            label: Apple-Silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel    # Intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The runner's own architecture — the backend binary is built natively.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: frontend/src-tauri

      - name: Restore the ffmpeg build
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg (LGPL)
        run: |
          brew install nasm
          scripts/build-ffmpeg.sh ${{ matrix.target }}

      - name: Backend build environment
        run: |
          python -m venv backend/venv_clean
          backend/venv_clean/bin/pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update package that installed copies download (in-app updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release-macos.sh ${{ matrix.target }}

      # The DMG for new installs, and the signed update package (named per chip
      # so the two builds don't collide) for copies that are already installed.
      - name: Collect the files to release
        run: |
          bundle="frontend/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          cp "$bundle/macos/Dubify Studio.app.tar.gz" "out/Dubify-Studio-${{ matrix.label }}.app.tar.gz"
          cp "$bundle/macos/Dubify Studio.app.tar.gz.sig" "out/Dubify-Studio-${{ matrix.label }}.app.tar.gz.sig"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: dubify-studio-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Tauri names them "Dubify Studio_<version>_<arch>.dmg"; the website
      # links to fixed names that stay the same from one version to the next.
      - name: Give the DMGs stable names
        run: |
          mv dist/*_aarch64.dmg dist/Dubify-Studio-Apple-Silicon.dmg
          mv dist/*_x64.dmg dist/Dubify-Studio-Intel.dmg
          ls -l dist

      # Installed copies read releases/latest/download/latest.json to find this
      # version and the update package for their chip.
      - name: Write the update manifest
        run: |
          python3 scripts/updater-manifest.py "$GITHUB_REF_NAME" dist > dist/latest.json
          cat dist/latest.json

      # The LGPL is satisfied by offering the FFmpeg source from the same place
      # as the binaries that include it.
      - name: Add the FFmpeg source
        run: |
          version=$(sed -n 's/^FFMPEG_VERSION="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          sha=$(sed -n 's/^FFMPEG_SHA256="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          curl -fL -o "dist/ffmpeg-$version.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          echo "$sha  dist/ffmpeg-$version.tar.xz" | sha256sum -c -

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: dist/*
