name: Desktop release

# Builds the macOS app for Apple Silicon and Intel on GitHub's Mac machines.
#
# Run it by pushing a version tag (it also creates a draft GitHub Release with
# both DMGs and the FFmpeg source):
#   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which only uploads the DMGs as
# build artifacts.
#
# Builds are unsigned (other Macs need right-click → Open) until these
# repository secrets exist: APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, and for notarization
# APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: building only reads the repo; the release job alone may
# create a release. Third-party actions are pinned to exact commits.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15          # Apple Silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The runner's own architecture — the backend binary is built natively.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: frontend/src-tauri

      - name: Restore the ffmpeg build
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg (LGPL)
        run: |
          brew install nasm
          scripts/build-ffmpeg.sh ${{ matrix.target }}

      - name: Backend build environment
        run: |
          python -m venv backend/venv_clean
          backend/venv_clean/bin/pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release-macos.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: dubify-studio-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The LGPL is satisfied by offering the FFmpeg source from the same place
      # as the binaries that include it.
      - name: Add the FFmpeg source
        run: |
          version=$(sed -n 's/^FFMPEG_VERSION="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          sha=$(sed -n 's/^FFMPEG_SHA256="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          curl -fL -o "dist/ffmpeg-$version.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          echo "$sha  dist/ffmpeg-$version.tar.xz" | sha256sum -c -

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: dist/*
