name: Desktop release

# Builds the macOS app for Apple Silicon and Intel on GitHub's Mac machines.
#
# Run it by pushing a version tag (it also creates a draft GitHub Release with
# both DMGs and the FFmpeg source):
#   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which only uploads the DMGs as
# build artifacts.
#
# A push to main builds too, only to save the caches (ffmpeg, FriBiDi, the
# character models, the Rust build): a run can read caches saved on its own tag
# or on main, never a previous tag's, so every release rebuilt them (12 and 7 of the Intel build's
# 26 minutes in 0.2.8). Release builds read main's caches and save none.
#
# The website's download buttons point at
#   releases/latest/download/Movelo-Studio-Apple-Silicon.dmg (and -Intel.dmg),
# so the DMGs are published under those fixed names. "latest" only counts
# published releases: the website offers a version once its draft is published.
#
# Installed copies update themselves: they read latest.json from the latest
# release and install the update package for their chip, signed with the
# TAURI_SIGNING_PRIVATE_KEY secret (the app has the matching public key).
#
# Builds are ad-hoc signed (on other Macs people confirm the app once, under
# System Settings → Privacy & Security → Open Anyway) until these repository
# secrets exist: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_PASSWORD
# (app-specific password), APPLE_TEAM_ID.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "**.md"]   # not checked for tags
  workflow_dispatch:

# Least privilege: building only reads the repo; the release job alone may
# create a release. Third-party actions are pinned to exact commits.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15          # Apple Silicon
            label: Apple-Silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel    # Intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The runner's own architecture — the backend binary is built natively.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: frontend/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore the ffmpeg build
        id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # The script returns at once when the restored build is the right version.
      - name: Build ffmpeg (LGPL)
        run: |
          [ "${{ steps.ffmpeg.outputs.cache-hit }}" = "true" ] || brew install nasm
          scripts/build-ffmpeg.sh ${{ matrix.target }}

      - name: Save the ffmpeg build
        if: github.ref == 'refs/heads/main' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      # Burned-in Khmer subtitles are shaped through FriBiDi (backend/build_sidecar.sh
      # stops without it).
      - name: Restore the FriBiDi build
        id: fribidi
        uses: actions/cache/restore@v6
        with:
          path: vendor/fribidi/${{ matrix.target }}
          key: fribidi-${{ matrix.target }}-${{ hashFiles('scripts/build-fribidi.sh') }}

      - name: Build FriBiDi (LGPL)
        run: scripts/build-fribidi.sh ${{ matrix.target }}

      - name: Save the FriBiDi build
        if: github.ref == 'refs/heads/main' && steps.fribidi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/fribidi/${{ matrix.target }}
          key: ${{ steps.fribidi.outputs.cache-primary-key }}

      # The voice and face models that are too big for git (backend/app/assets/models/
      # models.json; the backend bundles that folder and its self-test loads them).
      - name: Restore the character models
        id: models
        uses: actions/cache/restore@v6
        with:
          path: |
            backend/app/assets/models/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx
            backend/app/assets/models/face_recognition_sface_2021dec.onnx
          key: models-${{ hashFiles('backend/app/assets/models/models.json') }}

      # The script returns at once when the restored files are the right ones.
      - name: Fetch the character models
        run: scripts/fetch-models.sh

      - name: Save the character models
        if: github.ref == 'refs/heads/main' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            backend/app/assets/models/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx
            backend/app/assets/models/face_recognition_sface_2021dec.onnx
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Backend build environment
        run: |
          python -m venv backend/venv_clean
          backend/venv_clean/bin/pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update package that installed copies download (in-app updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release-macos.sh ${{ matrix.target }}

      # The DMG for new installs, and the signed update package (named per chip
      # so the two builds don't collide) for copies that are already installed.
      - name: Collect the files to release
        if: github.ref != 'refs/heads/main'
        run: |
          bundle="frontend/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          cp "$bundle/macos/Movelo Studio.app.tar.gz" "out/Movelo-Studio-${{ matrix.label }}.app.tar.gz"
          cp "$bundle/macos/Movelo Studio.app.tar.gz.sig" "out/Movelo-Studio-${{ matrix.label }}.app.tar.gz.sig"
          ls -l out

      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: movelo-studio-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

      # The update package as installed copies get it: its backend loads and
      # shapes Khmer on this chip (the Intel one on a real Intel Mac).
      - name: Self-test the update package
        if: github.ref != 'refs/heads/main'
        run: |
          d="$RUNNER_TEMP/package"; mkdir -p "$d/home"
          tar -xzf "out/Movelo-Studio-${{ matrix.label }}.app.tar.gz" -C "$d"
          (cd / && env -i HOME="$d/home" PATH=/usr/bin:/bin \
            "$d/Movelo Studio.app/Contents/Resources/backend/movelo-backend" --self-test) | tee "$d/self-test.txt"
          grep -q "Khmer text shaping: ok" "$d/self-test.txt"

      # The newest published release's data opens in this build (this one isn't
      # published yet). A failed check fails the job, so no draft is made.
      - name: Upgrade check
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/previous" -p "Movelo-Studio-${{ matrix.label }}.dmg"
          scripts/check-upgrade.sh "$RUNNER_TEMP/previous/Movelo-Studio-${{ matrix.label }}.dmg" out/*.dmg "$RUNNER_TEMP/upgrade-check"

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            frontend/src-tauri

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Tauri names them "Movelo Studio_<version>_<arch>.dmg"; the website
      # links to fixed names that stay the same from one version to the next.
      - name: Give the DMGs stable names
        run: |
          mv dist/*_aarch64.dmg dist/Movelo-Studio-Apple-Silicon.dmg
          mv dist/*_x64.dmg dist/Movelo-Studio-Intel.dmg
          ls -l dist

      # Installed copies read releases/latest/download/latest.json to find this
      # version and the update package for their chip.
      - name: Write the update manifest
        run: |
          python3 scripts/updater-manifest.py "$GITHUB_REF_NAME" dist > dist/latest.json
          cat dist/latest.json

      # Names, the feed, the signatures, each package's version and chip (the
      # build jobs ran the self-tests): nothing to download before publishing.
      - name: Check the release files
        run: |
          pip install --quiet cryptography
          python3 -I scripts/verify-release.py dist "${GITHUB_REF_NAME#v}" --no-self-test

      # The LGPL is satisfied by offering the FFmpeg and FriBiDi source from
      # the same place as the binaries that include them.
      - name: Add the FFmpeg and FriBiDi source
        run: |
          version=$(sed -n 's/^FFMPEG_VERSION="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          sha=$(sed -n 's/^FFMPEG_SHA256="\(.*\)"/\1/p' scripts/build-ffmpeg.sh)
          curl -fL -o "dist/ffmpeg-$version.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          echo "$sha  dist/ffmpeg-$version.tar.xz" | sha256sum -c -
          version=$(sed -n 's/^FRIBIDI_VERSION="\(.*\)"/\1/p' scripts/build-fribidi.sh)
          sha=$(sed -n 's/^FRIBIDI_SHA256="\(.*\)"/\1/p' scripts/build-fribidi.sh)
          curl -fL -o "dist/fribidi-$version.tar.xz" \
            "https://github.com/fribidi/fribidi/releases/download/v$version/fribidi-$version.tar.xz"
          echo "$sha  dist/fribidi-$version.tar.xz" | sha256sum -c -

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: dist/*
